<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR KING | QR Code Generator</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  background:
    radial-gradient(circle at top,#172554,#020617 55%);
  color:white;
  min-height:100vh;
}

header{
  text-align:center;
  padding:25px 15px 10px;
}

.logo{
  font-size:32px;
  font-weight:bold;
  color:#38bdf8;
  text-shadow:0 0 20px rgba(56,189,248,.7);
}

.subtitle{
  color:#94a3b8;
  margin-top:6px;
  font-size:14px;
}

/* PROFILE */

.profile{
  text-align:center;
  padding:30px 15px 15px;
}

.profile-img{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:3px solid #38bdf8;
  box-shadow:
    0 0 20px rgba(56,189,248,.5),
    0 0 50px rgba(37,99,235,.2);
  background:#111827;
}

.profile h2{
  margin-top:12px;
  font-size:22px;
}

.profile p{
  color:#94a3b8;
  margin-top:5px;
  font-size:14px;
}

/* MAIN */

.container{
  width:95%;
  max-width:650px;
  margin:20px auto;
}

.card{
  background:rgba(15,23,42,.82);
  border:1px solid rgba(56,189,248,.2);
  border-radius:20px;
  padding:20px;
  box-shadow:0 0 30px rgba(0,0,0,.35);
  backdrop-filter:blur(10px);
}

h1{
  text-align:center;
  margin-bottom:18px;
  font-size:25px;
}

/* BUTTONS */

.modes{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:18px;
}

.mode{
  border:none;
  padding:12px;
  border-radius:12px;
  background:#0f172a;
  color:#cbd5e1;
  border:1px solid #334155;
  cursor:pointer;
  font-size:14px;
}

.mode.active{
  background:#0284c7;
  color:white;
  border-color:#38bdf8;
  box-shadow:0 0 15px rgba(56,189,248,.35);
}

label{
  display:block;
  margin-bottom:7px;
  color:#cbd5e1;
  font-size:14px;
}

textarea,
input{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid #334155;
  background:#020617;
  color:white;
  outline:none;
  margin-bottom:15px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

textarea:focus,
input:focus{
  border-color:#38bdf8;
  box-shadow:0 0 10px rgba(56,189,248,.2);
}

.generate{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#0284c7,#2563eb);
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 20px rgba(37,99,235,.3);
}

.generate:hover{
  transform:translateY(-1px);
}

/* QR */

.qr-box{
  text-align:center;
  margin-top:25px;
  padding:20px;
  border-radius:18px;
  background:#020617;
  border:1px solid #1e3a5f;
}

#qrcode{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:20px;
}

#qrcode img{
  margin:auto;
  padding:10px;
  background:white;
  border-radius:10px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.action{
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:#1e293b;
  color:white;
  border:1px solid #334155;
}

.action:hover{
  border-color:#38bdf8;
}

.hidden{
  display:none;
}

/* FOOTER */

footer{
  text-align:center;
  padding:30px 15px;
  color:#64748b;
  font-size:13px;
}

@media(max-width:500px){
  .logo{
    font-size:28px;
  }

  .modes{
    grid-template-columns:1fr 1fr;
  }

  .actions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">👑 QR KING</div>
  <div class="subtitle">Fast • Simple • Powerful QR Generator</div>
</header>

<section class="profile">

  <img
    src="profile.jpg"
    alt="Himanshu Profile"
    class="profile-img">

  <h2>HIMANSHU</h2>

  <p>Creator • AI & Digital Technology</p>

</section>

<div class="container">

  <div class="card">

    <h1>Generate QR Code</h1>

    <div class="modes">

      <button class="mode active" onclick="setMode('text',this)">
        📝 Text
      </button>

      <button class="mode" onclick="setMode('link',this)">
        🔗 Link
      </button>

      <button class="mode" onclick="setMode('phone',this)">
        📞 Phone
      </button>

      <button class="mode" onclick="setMode('email',this)">
        📧 Email
      </button>

      <button class="mode" onclick="setMode('wifi',this)">
        📶 Wi-Fi
      </button>

      <button class="mode" onclick="setMode('contact',this)">
        👤 Contact
      </button>

      <button class="mode" onclick="setMode('location',this)">
        📍 Location
      </button>

    </div>

    <div id="fields"></div>

    <button class="generate" onclick="generateQR()">
      👑 Generate QR Code
    </button>

    <div class="qr-box">

      <div id="qrcode"></div>

      <div class="actions">

        <button class="action" onclick="downloadQR()">
          ⬇️ Download QR
        </button>

        <button class="action" onclick="copyData()">
          📋 Copy QR Data
        </button>

      </div>

    </div>

  </div>

</div>

<footer>
  © 2026 QR KING • Created by Himanshu
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

let currentMode = "text";
let lastData = "";

function setMode(mode,button){

  currentMode = mode;

  document.querySelectorAll(".mode").forEach(btn=>{
    btn.classList.remove("active");
  });

  button.classList.add("active");

  showFields();
}

function showFields(){

  const fields = document.getElementById("fields");

  if(currentMode === "text"){

    fields.innerHTML = `
      <label>Enter Text</label>
      <textarea id="data" placeholder="Write your text here..."></textarea>
    `;

  }

  else if(currentMode === "link"){

    fields.innerHTML = `
      <label>Website Link</label>
      <input id="data" type="url" placeholder="https://example.com">
    `;

  }

  else if(currentMode === "phone"){

    fields.innerHTML = `
      <label>Phone Number</label>
      <input id="data" type="tel" placeholder="+91XXXXXXXXXX">
    `;

  }

  else if(currentMode === "email"){

    fields.innerHTML = `
      <label>Email Address</label>
      <input id="data" type="email" placeholder="example@gmail.com">

      <label>Subject</label>
      <input id="subject" placeholder="Subject">

      <label>Message</label>
      <textarea id="message" placeholder="Email message"></textarea>
    `;

  }

  else if(currentMode === "wifi"){

    fields.innerHTML = `
      <label>Wi-Fi Name</label>
      <input id="ssid" placeholder="Wi-Fi Name">

      <label>Password</label>
      <input id="password" type="password" placeholder="Wi-Fi Password">

      <label>Security</label>
      <input id="security" value="WPA" placeholder="WPA / WEP / nopass">
    `;

  }

  else if(currentMode === "contact"){

    fields.innerHTML = `
      <label>Name</label>
      <input id="name" placeholder="Name">

      <label>Phone</label>
      <input id="phone" placeholder="+91XXXXXXXXXX">

      <label>Email</label>
      <input id="email" placeholder="example@gmail.com">
    `;

  }

  else if(currentMode === "location"){

    fields.innerHTML = `
      <label>Location / Google Maps Link</label>
      <input id="data" placeholder="Paste Google Maps link">
    `;

  }
}

function generateQR(){

  let data = "";

  if(currentMode === "text"){
    data = document.getElementById("data").value.trim();
  }

  else if(currentMode === "link"){
    data = document.getElementById("data").value.trim();
  }

  else if(currentMode === "phone"){

    const phone = document.getElementById("data").value.trim();

    data = "tel:" + phone;
  }

  else if(currentMode === "email"){

    const email = document.getElementById("data").value.trim();
    const subject = document.getElementById("subject").value.trim();
    const message = document.getElementById("message").value.trim();

    data =
      "mailto:" + email +
      "?subject=" + encodeURIComponent(subject) +
      "&body=" + encodeURIComponent(message);
  }

  else if(currentMode === "wifi"){

    const ssid = document.getElementById("ssid").value.trim();
    const password = document.getElementById("password").value.trim();
    const security = document.getElementById("security").value.trim();

    data =
      "WIFI:T:" + security +
      ";S:" + ssid +
      ";P:" + password +
      ";;";
  }

  else if(currentMode === "contact"){

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();

    data =
      "BEGIN:VCARD\n" +
      "VERSION:3.0\n" +
      "FN:" + name + "\n" +
      "TEL:" + phone + "\n" +
      "EMAIL:" + email + "\n" +
      "END:VCARD";
  }

  else if(currentMode === "location"){

    data = document.getElementById("data").value.trim();
  }

  if(!data){

    alert("Please enter your information first.");

    return;
  }

  lastData = data;

  const qr = document.getElementById("qrcode");

  qr.innerHTML = "";

  new QRCode(qr,{
    text:data,
    width:220,
    height:220,
    correctLevel:QRCode.CorrectLevel.H
  });

}

function downloadQR(){

  const img = document.querySelector("#qrcode img");

  if(!img){

    alert("First generate a QR code.");

    return;
  }

  const link = document.createElement("a");

  link.href = img.src;

  link.download = "QR-KING.png";

  link.click();

}

function copyData(){

  if(!lastData){

    alert("First generate a QR code.");

    return;
  }

  navigator.clipboard.writeText(lastData)
    .then(()=>{
      alert("QR data copied!");
    })
    .catch(()=>{
      alert("Copy failed.");
    });

}

showFields();

</script>

</body>
</html>
